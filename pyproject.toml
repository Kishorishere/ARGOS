[project]
name = "argos"
version = "0.1.0"
description = "Argos — Multi-Agent Trading Research Desk"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain>=0.3",
    "langchain-google-genai>=2.1",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "google-genai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "yfinance>=0.2",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]
